# common-llm Python 包的构建、依赖与静态检查配置
# 创建日期：2026-11-16
# 修改日期：2026-11-16
[project]
name = "common-llm"
version = "1.0.0"
description = "跨模型 API 与 Coding Agent 的统一调用库"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "openai==3.51.0",
    "anthropic==2.8.0",
    "google-genai==3.3.0",
    "claude-agent-sdk==0.2.182",
    "openai-codex==0.169.0",
    "PyYAML==6.0.3",
]

[dependency-groups]
dev = [
    "ruff==0.17.5",
    "mypy==2.4.1",
    "types-PyYAML==6.0.12.20261113",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/common_llm"]

[tool.ruff]
line-length = 180
target-version = "py311"
src = ["src", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "ASYNC"]
ignore = ["UP009"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["common_llm"]
